abstract_en: |
  This report discusses the design and implementation of a modern academic document automation pipeline using Markdown, Pandoc, Typst, Lua Filters, and a multi-pass DOCX engine. This pipeline enables authoring academic report content in standard Markdown, which is then compiled into print-quality PDF documents powered by Typst and formal Microsoft Word (.docx) documents with automated chapter and page numbering.
