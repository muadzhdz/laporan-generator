# Preset: Institut Teknologi Sepuluh Nopember (ITS)
preset_id: "its-skripsi"
name: "Institut Teknologi Sepuluh Nopember (ITS)"
description: "Format Tugas Akhir & Skripsi sesuai Pedoman Resmi ITS (Margin Atas 3cm, Kiri 3cm, Bawah 2.5cm, Kanan 2cm)."

# Margin halaman (Standar Resmi Pedoman TA ITS: Atas 3.0cm, Bawah 2.5cm, Kiri 3.0cm, Kanan 2.0cm)
margin_top: 3cm
margin_bottom: 2.5cm
margin_left: 3cm
margin_right: 2cm

# Tipografi
font_family: "Libertinus Serif"
font_size: 12pt
line_spacing: 0.75em
first_line_indent: 1.25cm

# Penomoran Heading
heading_chapter_prefix: "BAB "
heading_chapter_num_format: "roman"
heading_sub_dot: true
heading_subsub_dot: false

# Pengaturan Cover
cover_show_lecturer: true
cover_logo_width: 4.2cm
