abstract_id: |
  Penelitian ini merancang platform web edukasi robotika bervisualisasi 3D interaktif menggunakan metode Multimedia Development Life Cycle (MDLC). Platform ini mengintegrasikan rendering WebGL berbasis Three.js dengan arsitektur multi-role berbasis role-based access control (RBAC). Pengujian fungsional menunjukkan tingkat keberhasilan 100% dan rendering 3D berjalan stabil pada 60 FPS pada perangkat pengguna akhir.
keywords_id: ["MDLC", "Web 3D", "Three.js", "Robotika", "Edukasi"]
abstract_en: |
  This study develops an interactive 3D robotics education web platform using the Multimedia Development Life Cycle (MDLC) method. The platform integrates Three.js WebGL rendering with role-based access control (RBAC). Functional testing shows a 100% success rate with consistent 60 FPS rendering across consumer hardware.
